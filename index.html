<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Realm Guard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet" />
    <meta name="robots" content="noindex" />
    <style>
      html, body {
        margin: 0; height: 100%; background: #14121f; overflow: hidden; touch-action: none;
        overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      body { display: flex; flex-direction: column; }
      #game { flex: 1; min-height: 0; }
      /* 폰을 세로로 들면 게임이 너무 작아지므로 가로로 돌리라고 안내한다 (눌러서 닫을 수 있다) */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10; background: rgba(20, 18, 31, 0.97);
        color: #ffd36b; font: 700 20px/1.6 'Noto Sans KR', system-ui, sans-serif; text-align: center;
        align-items: center; justify-content: center; flex-direction: column; padding: 24px;
      }
      #rotate small { color: #9aa7c4; font-weight: 500; font-size: 14px; }
      @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" onclick="this.style.display='none'">
      <div>화면을 가로로 돌려 주세요<br />Please rotate your device</div>
      <small>(눌러서 그대로 계속하기 / tap to continue)</small>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
